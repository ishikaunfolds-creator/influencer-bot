lign-items:flex-start;gap:8px;border:1px solid #e8dfc4;background:#fffaf0;padding:10px;border-radius:8px;font-size:11px;color:#6d5a32;line-height:1.4}.approval input{margin:1px 0 0}.modal{border:0;border-radius:16px;padding:0;width:min(900px,calc(100vw - 28px));max-height:92vh;box-shadow:0 24px 80px rgba(16,35,25,.25)}.modal::backdrop{background:rgba(11,25,18,.56);backdrop-filter:blur(3px)}.modal-head{display:flex;justify-content:space-between;align-items:flex-start;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:white;z-index:1}.modal-head h2{margin:0;font-size:18px}.modal-head p{margin:5px 0 0;color:var(--muted);font-size:11px}.modal-close{border:0;background:#f0f3f0;border-radius:8px;width:30px;height:30px;font-size:17px}.modal-content{padding:18px 22px 22px;max-height:calc(92vh - 80px);overflow:auto}.modal-columns{display:grid;grid-template-columns:minmax(250px,.8fr) minmax(0,1.2fr);gap:20px}.modal-actions{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:15px}.modal-actions .group{display:flex;gap:8px;flex-wrap:wrap}.checkbox-row{display:flex;gap:8px;align-items:center;color:#4f5d56;font-size:11px;margin:10px 0}.toast{position:fixed;right:24px;bottom:24px;padding:12px 16px;background:#182c23;color:white;border-radius:10px;box-shadow:var(--shadow);z-index:20;font-size:12px;animation:in .18s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}.muted{color:var(--muted)}.tiny{font-size:10px}.divider{height:1px;background:var(--line);margin:14px 0}.hide{display:none!important}

<body>
  <div class="shell">
    <aside class="sidebar">

      <div><div class="nav-label">Workspace</div><nav class="nav" id="nav">

        <button data-view="prospects"><span class="ico">◎</span><span class="nav-text">Prospects</span></button>
        <button data-view="inbox"><span class="ico">✉</span><span class="nav-text">Replies</span></button>
        <button data-view="settings"><span class="ico">⚙</span><span class="nav-text">Campaign setup</span></button>
      </nav></div>

    <section class="workspace">
      <header class="topbar"><div class="crumb" id="breadcrumb">Workspace / Overview</div><div class="top-actions"><span class="top-campaign" id="campaignLabel"></span><div class="avatar">SG</div></div></header>

  <dialog class="modal" id="replyDialog"></dialog>
  <input type="file" id="importFile" accept=".csv,text/csv" class="hide">
  <div id="toastHost"></div>
  <script>
  (()=>{
    const KEY='sankar.creator.outreach.v1';
    const STATUS_OPTIONS=['New Lead','Email Available','Email Sent','Follow-up Due','Replied','Interested','Not Interested','Collaboration Confirmed'];
    const day=(offset=0)=>{const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+offset);return d.toISOString().slice(0,10)};
    const seed={settings:{campaignName:'Sustainable Living Creator Partnerships',brandName:'Sankar Group',senderName:'Sankar Group Partnerships',senderEmail:'partnerships@example.com',targetNiche:'sustainable living',targetLocation:'India',minFollowers:10000,maxFollowers:200000,collaboration:'A paid short-form video partnership featuring practical low-waste home products.'},leads:[
      {id:'SG-001',name:'Maya Green',username:'demo_maya_grows_01',profileUrl:'https://instagram.com/demo_maya_grows_01',niche:'Sustainable living',followers:58400,email:'maya@example.com',location:'India',bio:'Low-waste home routines and practical sustainable swaps.',status:'New Lead',source:'Synthetic public-profile fixture',createdAt:day(-2),initialSentAt:'',followUp1SentAt:'',followUp2SentAt:'',followUp1Due:'',followUp2Due:'',replyType:'',lastReply:'',optOut:false,owner:'Campaign team',notes:'Sample record. Verify public business contact details before a real campaign.'},
      {id:'SG-002',name:'Aarav Moves',username:'demo_aarav_moves_02',profileUrl:'https://instagram.com/demo_aarav_moves_02',niche:'Fitness and wellness',followers:142000,email:'aarav@example.com',location:'India',bio:'Everyday strength training, recovery, and wellness education.',status:'Email Available',source:'Synthetic public-profile fixture',createdAt:day(-2),initialSentAt:'',followUp1SentAt:'',followUp2SentAt:'',followUp1Due:'',followUp2Due:'',replyType:'',lastReply:'',optOut:false,owner:'Campaign team',notes:'Synthetic sample data.'},
      {id:'SG-003',name:'Nina Home Notes',username:'demo_nina_home_03',profileUrl:'https://instagram.com/demo_nina_home_03',niche:'Home organization',followers:27100,email:'nina@example.com',location:'India',bio:'Small-space organization and mindful home products.',status:'Email Sent',source:'Synthetic public-profile fixture',createdAt:day(-9),initialSentAt:day(-2),followUp1SentAt:'',followUp2SentAt:'',followUp1Due:day(2),followUp2Due:'',replyType:'',lastReply:'',optOut:false,owner:'Campaign team',notes:'Demo initial outreach logged; no message was sent.'},
      {id:'SG-004',name:'Rohan Reuse',username:'demo_rohan_reuse_04',profileUrl:'https://instagram.com/demo_rohan_reuse_04',niche:'Zero-waste lifestyle',followers:82200,email:'rohan@example.com',location:'India',bio:'Repair, reuse, and low-waste product reviews.',status:'Follow-up Due',source:'Synthetic public-profile fixture',createdAt:day(-15),initialSentAt:day(-8),followUp1SentAt:'',followUp2SentAt:'',followUp1Due:day(-4),followUp2Due:'',replyType:'',lastReply:'',optOut:false,owner:'Campaign team',notes:'Demo record with an overdue first follow-up.'},
      {id:'SG-005',name:'Leela Everyday',username:'demo_leela_daily_05',profileUrl:'https://instagram.com/demo_leela_daily_05',niche:'Sustainable fashion',followers:39600,email:'leela@example.com',location:'India',bio:'Repeat-wear outfits, fabric care, and slow fashion.',status:'Interested',source:'Synthetic public-profile fixture',createdAt:day(-14),initialSentAt:day(-10),followUp1SentAt:'',followUp2SentAt:'',followUp1Due:'',followUp2Due:'',replyType:'Interested',lastReply:'Could you share the campaign brief and expected timeline?',optOut:false,owner:'Campaign team',notes:'Synthetic reply for inbox demonstration.'},
      {id:'SG-006',name:'Dev Outside',username:'demo_dev_outdoors_06',profileUrl:'https://instagram.com/demo_dev_outdoors_06',niche:'Outdoor travel',followers:211000,email:'dev@example.com',location:'India',bio:'Weekend hikes and responsible outdoor travel.',status:'Not Interested',source:'Synthetic public-profile fixture',createdAt:day(-20),initialSentAt:day(-16),followUp1SentAt:'',followUp2SentAt:'',followUp1Due:'',followUp2Due:'',replyType:'Not Interested',lastReply:'Thanks for reaching out. I am not taking partnerships this season.',optOut:false,owner:'Campaign team',notes:'Synthetic reply. Follow-ups are stopped.'},
      {id:'SG-007',name:'Priya Planet Kitchen',username:'demo_priya_kitchen_07',profileUrl:'https://instagram.com/demo_priya_kitchen_07',niche:'Low-waste cooking',followers:73500,email:'priya@example.com',location:'India',bio:'Seasonal recipes and plastic-light kitchen routines.',status:'Collaboration Confirmed',source:'Synthetic public-profile fixture',createdAt:day(-30),initialSentAt:day(-26),followUp1SentAt:'',followUp2SentAt:'',followUp1Due:'',followUp2Due:'',replyType:'Interested',lastReply:'Confirmed. Please send the agreement and next steps.',optOut:false,owner:'Campaign team',notes:'Synthetic completed outcome.'},
      {id:'SG-008',name:'Mira City Finds',username:'demo_mira_city_08',profileUrl:'https://instagram.com/demo_mira_city_08',niche:'Urban lifestyle',followers:15900,email:'',location:'India',bio:'Local cafes, simple routines, and neighborhood finds.',status:'New Lead',source:'Synthetic public-profile fixture',createdAt:day(-1),initialSentAt:'',followUp1SentAt:'',followUp2SentAt:'',followUp1Due:'',followUp2Due:'',replyType:'',lastReply:'',optOut:false,owner:'Campaign team',notes:'No public business email provided in this synthetic fixture.'}
    ],activities:[{id:'ACT-1',leadId:'SG-005',kind:'reply',at:day(-1),text:'Interested. Could you share the campaign brief and expected timeline?'},{id:'ACT-2',leadId:'SG-006',kind:'reply',at:day(-3),text:'Not taking partnerships this season. Thanks for asking.'},{id:'ACT-3',leadId:'SG-007',kind:'reply',at:day(-7),text:'Confirmed. Please send the agreement and next steps.'}]};
    let state=load();let currentView='dashboard';let currentLeadId=null;let draftTab='initial';let leadFilter='';let statusFilter='All statuses';
    function load(){try{const raw=localStorage.getItem(KEY);return raw?JSON.parse(raw):structuredClone(seed)}catch{return structuredClone(seed)}}
    function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function fmt(n){return Number(n||0).toLocaleString('en-IN')}
    function dateFmt(v){if(!v)return '—';const d=new Date(v+'T12:00:00');return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
    function makeId(){return 'SG-'+String(Date.now()).slice(-6)}
    function score(lead){const target=state.settings.targetNiche.toLowerCase().trim();const niche=String(lead.niche||'').toLowerCase();const words=target.split(/\s+/).filter(w=>w.length>3);const hit=niche.includes(target)||words.some(w=>niche.includes(w));const nichePts=hit?40:(words.some(w=>String(lead.bio||'').toLowerCase().includes(w))?24:8);const f=Number(lead.followers||0),min=Number(state.settings.minFollowers||0),max=Number(state.settings.maxFollowers||999999999);const followerPts=f>=min&&f<=max?20:(f>0&&((f<min&&f>=min*.5)||(f>max&&f<=max*1.5))?10:4);const loc=String(lead.location||'').toLowerCase();const locPts=!state.settings.targetLocation?10:(loc.includes(state.settings.targetLocation.toLowerCase())?15:(loc?5:0));const emailPts=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(lead.email||''))?15:0;const profilePts=(lead.username?5:0)+(lead.profileUrl?3:0)+(lead.bio?2:0);return Math.min(100,nichePts+followerPts+locPts+emailPts+profilePts)}
    function exampleStop(s){return ['Not Interested','Interested','Collaboration Confirmed'].includes(s)}
    function scoreLabel(n){return n>=75?'Strong fit':n>=55?'Review fit':'Low fit'}
    function dueStep(l){if(l.optOut||['Replied','Interested','Not Interested','Collaboration Confirmed'].includes(l.status)||l.lastReply)return '';if(!l.initialSentAt)return '';if(!l.followUp1SentAt){return l.followUp1Due&&l.followUp1Due<=day(0)?'Follow-up 1 due':''}if(!l.followUp2SentAt){return l.followUp2Due&&l.followUp2Due<=day(0)?'Follow-up 2 due':''}return ''}
    function dueDate(l){if(!l.initialSentAt)return '';if(!l.followUp1SentAt)return l.followUp1Due||'';if(!l.followUp2SentAt)return l.followUp2Due||'';return ''}
    function statusClass(s){if(['Interested','Collaboration Confirmed'].includes(s))return 'good';if(s==='Follow-up Due')return 'warn';if(s==='Not Interested')return 'bad';if(['Email Sent','Replied'].includes(s))return 'blue';return ''}
    function refreshDueStatuses(){for(const l of state.leads){if(dueStep(l))l.status='Follow-up Due';else if(l.status==='Follow-up Due')l.status='Email Sent'}}
    function toast(msg){const host=document.getElementById('toastHost');host.innerHTML=`<div class="toast">${esc(msg)}</div>`;setTimeout(()=>host.innerHTML='',2800)}
    function setView(view){currentView=view;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));document.getElementById('breadcrumb').textContent='Workspace / '+({dashboard:'Overview',prospects:'Prospects',inbox:'Replies',settings:'Campaign setup'}[view]||view);render()}
    function pageHead(title,desc,buttons=''){return `<div class="page-head"><div><p class="eyebrow">Sankar Group · outreach workspace</p><h1>${title}</h1><p>${desc}</p></div><div class="actions">${buttons}</div></div>`}
    function banner(){return `<div class="demo-banner"><span class="dot"></span><div><b>Local demo mode.</b> Profile records, AI-style scoring, message approval, replies, and send history stay in this browser. “Log demo send” records an approved action; it does not send email. Scoring uses visible rules, not a connected Claude model.</div></div>`}
    function kpi(label,value,foot){return `<div class="card kpi"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="kpi-foot">${foot}</div></div>`}
    function activityLabel(a){if(a.kind==='sent')return 'Approved demo email logged';if(a.kind==='followup')return 'Approved demo follow-up logged';if(a.kind==='reply')return 'Reply added to demo inbox';if(a.kind==='status')return 'CRM status updated';return a.kind}
    function renderDashboard(){refreshDueStatuses();const leads=state.leads;const due=leads.filter(l=>dueStep(l));const emailReady=leads.filter(l=>l.email).length;const qualified=leads.filter(l=>score(l)>=75).length;const totalSent=state.activities.filter(a=>['sent','followup'].includes(a.kind)).length;const statusRows=STATUS_OPTIONS.map(s=>[s,leads.filter(l=>l.status===s).length]).filter(x=>x[1]);const max=Math.max(1,...statusRows.map(x=>x[1]));const recent=[...state.activities].sort((a,b)=>String(b.at).localeCompare(String(a.at))).slice(0,5);const actions=due.slice(0,4);
      return pageHead('Overview','A working demo of the influencer research-to-reply workflow.',`<button class="btn" data-action="import">Import CSV</button><button class="btn primary" data-action="add-lead">+ Add prospect</button>`)+banner()+`<div class="grid kpis">${kpi('Prospects',leads.length,'Unique CRM records')}${kpi('Business emails found',emailReady,'Public contact field populated')}${kpi('Strong fit',qualified,'Rule-based score ≥ 75')}${kpi('Follow-ups due',due.length,due.length?'Review before logging a send':'No overdue demo follow-ups')}</div><div class="grid two-col"><section class="card"><div class="card-head"><div><h2>Outreach pipeline</h2><p>${totalSent} demo send${totalSent===1?'':'s'} logged · no messages delivered</p></div><button class="btn small" data-view="prospects">Open CRM</button></div><div class="card-body"><div class="pipeline">${statusRows.map(([s,n])=>`<div class="pipeline-row"><span>${esc(s)}</span><div class="bar"><span style="width:${Math.max(6,Math.round(n/max*100))}%"></span></div><b>${n}</b></div>`).join('')||'<div class="empty">Add a prospect to begin.</div>'}</div></div></section><section class="card"><div class="card-head"><div><h2>Needs attention</h2><p>Follow-up dates use campaign rules</p></div></div><div class="card-body"><div class="row-list">${actions.length?actions.map(l=>`<div class="action-row"><div><strong>${esc(l.name)}</strong><div class="desc">${esc(dueStep(l))} · due ${dateFmt(dueDate(l))}</div></div><button class="btn small" data-action="open-lead" data-id="${esc(l.id)}">Review</button></div>`).join(''):'<div class="empty">No follow-ups due. A reply, decline, or opt-out stops follow-up reminders.</div>'}</div></div></section></div><div class="section-title">Recent activity</div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Prospect</th><th>Activity</th><th>Details</th></tr></thead><tbody>${recent.length?recent.map(a=>{const l=leads.find(x=>x.id===a.leadId);return `<tr><td>${dateFmt(a.at)}</td><td>${esc(l?.name||'Unknown')}</td><td>${esc(activityLabel(a))}</td><td>${esc(String(a.text||'').slice(0,100)||'—')}</td></tr>`}).join(''):'<tr><td colspan="4" class="empty">No activity yet.</td></tr>'}</tbody></table></div></div>`

    function row(l){const s=score(l);const due=dueStep(l);return `<tr><td><div class="person"><div class="person-mark">${esc((l.name||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase())}</div><div><div class="person-name">${esc(l.name)}</div><div class="person-handle">@${esc(l.username)}</div></div></div></td><td>${esc(l.niche||'—')}</td><td>${fmt(l.followers)}</td><td>${l.email?`<span title="Public business contact recorded">${esc(l.email)}</span>`:'<span class="muted">Not found</span>'}</td><td><span class="score"><span class="score-dot" style="background:${s>=75?'#62a77a':s>=55?'#d0a64f':'#c17a70'}"></span>${s}</span><div class="tiny muted">${scoreLabel(s)}</div></td><td><span class="status ${statusClass(due?'Follow-up Due':l.status)}">${esc(due?'Follow-up Due':l.status)}</span></td><td><button class="table-action" data-action="open-lead" data-id="${esc(l.id)}">Review →</button></td></tr>`}
    function renderProspects(){refreshDueStatuses();const q=leadFilter.toLowerCase();const filtered=state.leads.filter(l=>(statusFilter==='All statuses'||(dueStep(l)?'Follow-up Due':l.status)===statusFilter)&&[l.name,l.username,l.niche,l.email,l.location].join(' ').toLowerCase().includes(q)).sort((a,b)=>score(b)-score(a));return pageHead('Prospects','Research public business information, check fit, and manage every outreach step.',`<button class="btn" data-action="import">Import CSV</button><button class="btn" data-action="export">Export CSV</button><button class="btn primary" data-action="add-lead">+ Add prospect</button>`)+banner()+`<section class="card"><div class="toolbar"><div class="toolbar-left"><input class="field" id="leadSearch" type="search" placeholder="Search name, handle, niche…" value="${esc(leadFilter)}"><select class="select" id="statusFilter"><option>All statuses</option>${STATUS_OPTIONS.map(s=>`<option ${statusFilter===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="toolbar-right"><span class="tiny muted">${filtered.length} of ${state.leads.length} records · sorted by fit score</span></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Creator</th><th>Niche</th><th>Followers</th><th>Public business email</th><th>Fit score</th><th>Status</th><th></th></tr></thead><tbody>${filtered.length?filtered.map(row).join(''):'<tr><td colspan="7" class="empty">No matching prospects. Add one or change the filters.</td></tr>'}</tbody></table></div></section><p class="helper" style="margin-top:12px">Score components: niche fit (40), audience-size fit (20), location (15), public email (15), and profile completeness (10). The score is a transparent rule-based demo aid, not an AI prediction.</p>`}
    function renderInbox(){const items=state.activities.filter(a=>a.kind==='reply').sort((a,b)=>String(b.at).localeCompare(String(a.at)));return pageHead('Replies','Classify incoming replies, prepare a response draft, and stop follow-ups after a response or opt-out.',`<button class="btn primary" data-action="add-reply">+ Add demo reply</button>`)+banner()+`<div class="grid two-col"><section class="card"><div class="card-head"><div><h2>Demo inbox</h2><p>Replies below are synthetic test fixtures</p></div><span class="status blue">${items.length} sample replies</span></div><div class="card-body"><div class="row-list">${items.length?items.map(a=>{const l=state.leads.find(x=>x.id===a.leadId);const c=classify(a.text||'');return `<article class="inbox-item"><div class="inbox-top"><div><strong>${esc(l?.name||'Unknown')}</strong><div class="inbox-meta">${esc(l?.email||'No email')} · ${dateFmt(a.at)}</div></div><span class="status ${c==='Opt-out'?'bad':c==='Interested'?'good':'blue'}">${esc(c)}</span></div><blockquote>${esc(a.text||'')}</blockquote><div class="actions"><button class="btn small" data-action="open-reply" data-id="${esc(l?.id||'')}">Review reply draft</button></div></article>`}).join(''):'<div class="empty">No replies yet. Add a synthetic reply to demonstrate classification.</div>'}</div></div></section><section class="card"><div class="card-head"><div><h2>Reply handling rules</h2><p>Simple local classification for demo purposes</p></div></div><div class="card-body"><div class="guide-list"><div class="guide-item"><span class="step-number">1</span><div><b>Check intent</b><p>Keyword rules label positive interest, a decline, pricing questions, collaboration requests, or opt-outs.</p></div></div><div class="guide-item"><span class="step-number">2</span><div><b>Stop the sequence</b><p>Any recorded reply stops both follow-up steps. Opt-out sets an explicit suppression flag.</p></div></div><div class="guide-item"><span class="step-number">3</span><div><b>Review the draft</b><p>Open a reply to edit a suggested response. The demo never sends it.</p></div></div></div></div></section></div>`}
    function renderSettings(){const s=state.settings;return pageHead('Campaign setup','Set the criteria used by fit scoring and the fields inserted into message drafts.')+banner()+`<div class="settings-layout"><section class="card"><div class="card-head"><div><h2>Campaign details</h2><p>These settings stay in this browser</p></div></div><div class="card-body"><form id="settingsForm" class="form-grid"><div class="form-field"><label>Campaign name</label><input class="field" name="campaignName" value="${esc(s.campaignName)}" required></div><div class="form-field"><label>Brand</label><input class="field" name="brandName" value="${esc(s.brandName)}" required></div><div class="form-field"><label>Target niche or keyword</label><input class="field" name="targetNiche" value="${esc(s.targetNiche)}" required></div><div class="form-field"><label>Target location</label><input class="field" name="targetLocation" value="${esc(s.targetLocation)}"></div><div class="form-field"><label>Minimum followers</label><input class="field" name="minFollowers" type="number" min="0" value="${esc(s.minFollowers)}"></div><div class="form-field"><label>Maximum followers</label><input class="field" name="maxFollowers" type="number" min="0" value="${esc(s.maxFollowers)}"></div><div class="form-field"><label>Sender name</label><input class="field" name="senderName" value="${esc(s.senderName)}" required></div><div class="form-field"><label>Sender business email</label><input class="field" name="senderEmail" type="email" value="${esc(s.senderEmail)}" required><small>Use a real monitored mailbox only after connecting an authorized sender.</small></div><div class="form-field wide"><label>Collaboration offer</label><textarea class="textarea" name="collaboration">${esc(s.collaboration)}</textarea></div><div class="form-field wide"><div class="actions"><button class="btn primary" type="submit">Save campaign settings</button><button class="btn" type="button" data-action="reset-demo">Reset demo data</button></div></div></form></div></section><aside class="card"><div class="card-head"><div><h2>Workflow in this build</h2><p>Local steps covered by the demo</p></div></div><div class="card-body"><div class="guide-list"><div class="guide-item"><span class="step-number">1</span><div><b>Research</b><p>Manually enter public profile details or import a CSV. Duplicate handles and emails are skipped.</p></div></div><div class="guide-item"><span class="step-number">2</span><div><b>Filter</b><p>Rule-based fit score and summary help rank prospects using your campaign settings.</p></div></div><div class="guide-item"><span class="step-number">3</span><div><b>Approve</b><p>Review and edit each draft. A checkbox is required before the app logs a demo send.</p></div></div><div class="guide-item"><span class="step-number">4</span><div><b>Follow up</b><p>First reminder is due four days after initial outreach. Second is due six days after follow-up one.</p></div></div><div class="guide-item"><span class="step-number">5</span><div><b>Handle replies</b><p>Add a sample reply, inspect its classification and edit a suggested reply draft.</p></div></div></div></div></aside></div>`}
    function render(){persist();document.getElementById('campaignLabel').textContent=state.settings.campaignName;const app=document.getElementById('app');app.innerHTML=({dashboard:renderDashboard,prospects:renderProspects,inbox:renderInbox,settings:renderSettings}[currentView]||renderDashboard)();bindPage()}
    function bindPage(){const s=document.getElementById('leadSearch');if(s)s.addEventListener('input',e=>{leadFilter=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('leadSearch');n.focus();n.setSelectionRange(pos,pos)});const f=document.getElementById('statusFilter');if(f)f.addEventListener('change',e=>{statusFilter=e.target.value;render()});const sf=document.getElementById('settingsForm');if(sf)sf.addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(sf).entries());state.settings={...state.settings,...d,minFollowers:Number(d.minFollowers||0),maxFollowers:Number(d.maxFollowers||0)};persist();toast('Campaign settings saved. Fit scores updated.');render()});}
    function emailDraft(l,type){const s=state.settings;const greet=`Hi ${l.name.split(' ')[0]},`;const details=l.bio?`Your public profile focuses on ${l.niche||'your content'}—especially ${l.bio.replace(/[.!?]$/,'')}.`: `Your public profile in ${l.niche||'this category'} looks relevant to this campaign.`;if(type==='initial')return `${greet}\n\nI’m ${s.senderName} from ${s.brandName}. We’re reaching out about a creator collaboration: ${s.collaboration}\n\nWe selected your profile because ${details} If this sounds relevant, could I share the brief, timeline, and budget range?\n\nBest,\n${s.senderName}\n${s.brandName}\n${s.senderEmail}\n\nIf you would rather not receive partnership emails from us, reply “opt out” and we will stop.`;if(type==='followup1')return `${greet}\n\nI’m following up once on my note about a possible ${s.brandName} creator collaboration. Your ${l.niche||'creator'} content may fit the campaign, and I’d be glad to send the brief and budget range.\n\nIf the timing is not right, just let me know and I’ll close the loop. You can also reply “opt out” to stop partnership emails.\n\nBest,\n${s.senderName}`;if(type==='followup2')return `${greet}\n\nOne final note from me about the ${s.brandName} collaboration. If you’re interested, I can send the brief and proposed timeline. If not, no reply is needed and I will not follow up again.\n\nBest,\n${s.senderName}\n${s.senderEmail}\n\nReply “opt out” to stop future partnership emails.`;return `Hi ${l.name.split(' ')[0]},\n\nThanks for getting back to us. ${l.replyType==='Interested'?'I can share the campaign brief, proposed timeline, and budget range.':l.replyType==='Pricing Question'?'I can send our budget range and deliverables for your review.':'I appreciate the update. I’ll make sure our team follows your preference.'}\n\nBest,\n${s.senderName}\n${s.brandName}\n${s.senderEmail}`}
    function openLead(id='',tab='initial'){currentLeadId=id;draftTab=tab;const l=id?state.leads.find(x=>x.id===id):{id:'',name:'',username:'',profileUrl:'',niche:'',followers:'',email:'',location:'',bio:'',status:'New Lead',source:'Public profile research',createdAt:day(),initialSentAt:'',followUp1SentAt:'',followUp2SentAt:'',followUp1Due:'',followUp2Due:'',replyType:'',lastReply:'',optOut:false,owner:'Campaign team',notes:''};if(!l)return;const modal=document.getElementById('leadDialog');modal.innerHTML=leadDialogHtml(l);modal.showModal();bindLeadModal(l)}
    function leadDialogHtml(l){const types=[['initial','Initial email'],['followup1','Follow-up 1'],['followup2','Follow-up 2'],['reply','Reply draft']];const drafts=Object.fromEntries(types.map(([key])=>[key,emailDraft(l,key)]));const approved=dueStep(l);const sendType=approved==='Follow-up 1 due'?'followup1':approved==='Follow-up 2 due'?'followup2':'initial';const canInitial=!!l.id&&!!l.email&&!l.initialSentAt&&!l.optOut&&!['Not Interested','Interested','Collaboration Confirmed'].includes(l.status);const canFollow=!!approved;return `<div class="modal-head"><div><h2>${l.id?'Prospect review':'Add a prospect'}</h2><p>${l.id?`${esc(l.id)} · Fit score ${score(l)}/100 (${scoreLabel(score(l))})`:'Add only publicly available business information.'}</p></div><button type="button" class="modal-close" data-action="close-lead" aria-label="Close">×</button></div><div class="modal-content"><div class="modal-columns"><div><form id="leadForm" class="form-grid"><input type="hidden" name="id" value="${esc(l.id)}"><div class="form-field wide"><label>Creator name</label><input class="field" name="name" value="${esc(l.name)}" required></div><div class="form-field"><label>Instagram username</label><input class="field" name="username" value="${esc(l.username)}" placeholder="public_handle" required></div><div class="form-field"><label>Instagram profile URL</label><input class="field" name="profileUrl" type="url" value="${esc(l.profileUrl)}" placeholder="https://instagram.com/…"></div><div class="form-field"><label>Niche / category</label><input class="field" name="niche" value="${esc(l.niche)}"></div><div class="form-field"><label>Follower count</label><input class="field" name="followers" type="number" min="0" value="${esc(l.followers)}"></div><div class="form-field"><label>Public business email</label><input class="field" name="email" type="email" value="${esc(l.email)}"></div><div class="form-field"><label>Location</label><input class="field" name="location" value="${esc(l.location)}"></div><div class="form-field wide"><label>Public profile notes</label><textarea class="textarea" name="bio">${esc(l.bio)}</textarea></div><div class="form-field"><label>CRM status</label><select class="select" name="status">${STATUS_OPTIONS.map(s=>`<option ${l.status===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="form-field"><label>Source / research note</label><input class="field" name="source" value="${esc(l.source)}"></div><div class="form-field wide"><label>Internal note</label><textarea class="textarea" name="notes">${esc(l.notes)}</textarea></div><div class="form-field wide"><label class="checkbox-row"><input type="checkbox" name="optOut" ${l.optOut?'checked':''}> Suppress future outreach for this contact</label></div></form><p class="helper">Use public business contact details only. Do not collect private data or use unauthorized access.</p></div><div><div class="card" style="box-shadow:none"><div class="card-head"><div><h2>Message workspace</h2><p>Read, edit, and approve before logging any demo send</p></div></div><div class="card-body"><div class="tabs">${types.map(([key,label])=>`<button type="button" class="${draftTab===key?'active':''}" data-draft-tab="${key}">${label}</button>`).join('')}</div><div class="form-field"><label id="draftSubjectLabel">${draftTab==='reply'?'Suggested reply':'Subject'}</label><input class="field" id="draftSubject" value="${esc(draftTab==='reply'?'Re: Creator collaboration · '+state.settings.brandName:subjectFor(l,draftTab))}"></div><div class="form-field" style="margin-top:10px"><label>Draft body</label><textarea class="textarea" id="draftBody" style="min-height:265px">${esc(drafts[draftTab])}</textarea></div><div class="helper" style="margin-top:9px">Personalization uses only the notes saved in this record and your campaign settings. Verify every detail before real outreach.</div><div class="divider"></div><label class="approval"><input id="approveCheck" type="checkbox"><span>I reviewed this draft, recipient, sender identity, and opt-out language. Enable a demo log action.</span></label><div class="modal-actions"><div class="group"><button type="button" class="btn" data-action="save-lead">Save record</button>${l.id?`<button type="button" class="btn" data-action="confirm-collab">Mark collaboration confirmed</button>`:''}</div><button type="button" class="btn primary" data-action="demo-send" data-type="${sendType}" ${((sendType==='initial'&&!canInitial)||(sendType!=='initial'&&!canFollow))?'disabled':''}>${canFollow?'Log approved '+(sendType==='followup1'?'follow-up 1':'follow-up 2')+' demo':'Log approved initial demo'}</button></div>${l.initialSentAt?`<p class="helper" style="margin-top:11px">Initial email logged ${dateFmt(l.initialSentAt)} · follow-up 1 due ${dateFmt(l.followUp1Due)} · follow-up 1 logged ${dateFmt(l.followUp1SentAt)} · follow-up 2 due ${dateFmt(l.followUp2Due)}. A reply or opt-out stops reminders.</p>`:''}</div></div></div></div></div>`}
    function subjectFor(l,type){if(type==='reply')return 'Re: Creator collaboration · '+state.settings.brandName;if(type==='followup1')return 'Following up · creator collaboration';if(type==='followup2')return 'Closing the loop · creator collaboration';return `Creator collaboration opportunity · ${state.settings.brandName}`}
    function bindLeadModal(l){const modal=document.getElementById('leadDialog');modal.querySelectorAll('[data-draft-tab]').forEach(b=>b.addEventListener('click',()=>{draftTab=b.dataset.draftTab;const values={};modal.querySelectorAll('[data-draft-tab]').forEach(btn=>values[btn.dataset.draftTab]=btn.classList.contains('active')?document.getElementById('draftBody').value:emailDraft(l,btn.dataset.draftTab));const subject=document.getElementById('draftSubject').value;modal.innerHTML=leadDialogHtml(l);bindLeadModal(l);if(draftTab!=='reply')document.getElementById('draftSubject').value=subject;document.getElementById('draftBody').value=values[draftTab]||emailDraft(l,draftTab)}));modal.querySelector('[data-action="close-lead"]').addEventListener('click',()=>modal.close());modal.querySelector('[data-action="save-lead"]').addEventListener('click',()=>saveLeadFromForm());const ap=modal.querySelector('#approveCheck');const send=modal.querySelector('[data-action="demo-send"]');if(send)ap.addEventListener('change',()=>{const eligible=send.dataset.type==='initial'?!!l.id&&!!l.email&&!l.initialSentAt&&!l.optOut&&!exampleStop(l.status):!!dueStep(l);send.disabled=!ap.checked||!eligible});const form=modal.querySelector('#leadForm');form.addEventListener('change',()=>{const raw=Object.fromEntries(new FormData(form).entries());const temp={...l,...raw,followers:Number(raw.followers||0)};const ok=!!temp.email&&!temp.initialSentAt&&!temp.optOut&&!['Not Interested','Interested','Collaboration Confirmed'].includes(temp.status);if(send&&send.dataset.type==='initial'&&!ok)send.disabled=true});if(send)send.addEventListener('click',()=>{if(!ap.checked){toast('Review and approve the draft first.');return}if(!l.id){saveLeadFromForm(true);return}saveLeadFromForm(true);const current=state.leads.find(x=>x.id===l.id);if(!current)return;const type=send.dataset.type;if(type==='initial'){current.initialSentAt=day();current.followUp1Due=day(4);current.status='Email Sent'}else if(type==='followup1'){current.followUp1SentAt=day();current.followUp2Due=day(6);current.status='Email Sent'}else{current.followUp2SentAt=day();current.status='Email Sent'}state.activities.push({id:makeId(),leadId:current.id,kind:type==='initial'?'sent':'followup',at:day(),text:`${subjectFor(current,type)} · demo log only`});persist();document.getElementById('leadDialog').close();toast('Approved action logged locally. No email was sent.');render()});const conf=modal.querySelector('[data-action="confirm-collab"]');if(conf)conf.addEventListener('click',()=>{const current=state.leads.find(x=>x.id===l.id);if(current){current.status='Collaboration Confirmed';persist();modal.close();toast('CRM status updated.');render()}})}
    function saveLeadFromForm(andContinue=false){const form=document.getElementById('leadForm');const raw=Object.fromEntries(new FormData(form).entries());const l={...raw,followers:Number(raw.followers||0),optOut:form.elements.optOut.checked};if(!l.name||!l.username){toast('Enter a creator name and Instagram username.');return}const dup=state.leads.find(x=>x.id!==l.id&&(x.username.toLowerCase().replace(/^@/,'')===l.username.toLowerCase().replace(/^@/,'')||(l.email&&x.email&&x.email.toLowerCase()===l.email.toLowerCase())));if(dup){toast(`Duplicate found: ${dup.name}. Existing record kept.`);return}if(l.optOut){l.status='Not Interested';l.followUp1Due='';l.followUp2Due=''}if(l.id){const ix=state.leads.findIndex(x=>x.id===l.id);state.leads[ix]={...state.leads[ix],...l}}else{l.id=makeId();l.createdAt=day();l.initialSentAt='';l.followUp1SentAt='';l.followUp2SentAt='';l.followUp1Due='';l.followUp2Due='';l.replyType='';l.lastReply='';l.owner='Campaign team';state.leads.unshift(l);currentLeadId=l.id}persist();if(!andContinue){document.getElementById('leadDialog').close();toast('Prospect saved.');render()}}
    function classify(text){const t=String(text||'').toLowerCase();if(/\b(opt.?out|unsubscribe|remove me|stop emailing|do not contact)\b/.test(t))return 'Opt-out';if(/\b(not interested|no thanks|not taking|decline|pass for now)\b/.test(t))return 'Not Interested';if(/\b(rate|pricing|budget|fee|paid|payment|deliverable)\b/.test(t))return 'Pricing Question';if(/\b(interested|sounds good|tell me more|share the brief|let.s talk|open to)\b/.test(t))return 'Interested';if(/\b(collaborat|partnership|brand deal)\b/.test(t))return 'Collaboration Request';return 'Other'}
    function openReply(){const elig=state.leads.filter(l=>l.initialSentAt||['Email Sent','Follow-up Due'].includes(l.status));if(!elig.length){toast('Log an initial demo send first, then add a reply.');return}const dialog=document.getElementById('replyDialog');dialog.innerHTML=`<div class="modal-head"><div><h2>Add a demo reply</h2><p>This stores a synthetic inbox event only.</p></div><button type="button" class="modal-close" data-action="close-reply">×</button></div><div class="modal-content"><form id="replyForm" class="form-grid"><div class="form-field wide"><label>Prospect</label><select class="select" name="leadId" required>${elig.map(l=>`<option value="${esc(l.id)}">${esc(l.name)} · ${esc(l.email||'no email')}</option>`).join('')}</select></div><div class="form-field wide"><label>Reply text</label><textarea class="textarea" name="text" required placeholder="Paste a reply from an authorized test inbox, or use this synthetic example…">Thanks for reaching out. Could you share the campaign brief and budget range?</textarea></div><div class="form-field wide"><div class="helper">Classification uses local keyword rules. Any reply stops automatic follow-up reminders. “Opt out” also sets the suppression flag.</div></div><div class="form-field wide"><div class="actions"><button class="btn primary" type="submit">Classify and add to demo inbox</button><button type="button" class="btn" data-action="close-reply">Cancel</button></div></div></form></div>`;dialog.showModal();dialog.querySelectorAll('[data-action="close-reply"]').forEach(b=>b.addEventListener('click',()=>dialog.close()));dialog.querySelector('#replyForm').addEventListener('submit',e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());const l=state.leads.find(x=>x.id===d.leadId);const type=classify(d.text);l.replyType=type;l.lastReply=d.text;if(type==='Opt-out'){l.optOut=true;l.status='Not Interested'}else if(type==='Not Interested')l.status='Not Interested';else if(type==='Interested'||type==='Collaboration Request')l.status='Interested';else l.status='Replied';l.followUp1Due='';l.followUp2Due='';state.activities.push({id:makeId(),leadId:l.id,kind:'reply',at:day(),text:d.text});persist();dialog.close();toast(`Reply classified: ${type}. Follow-ups stopped.`);setView('inbox')})}
    function parseCsv(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&quoted&&n==='"'){cell+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(cell);if(row.some(v=>v.trim()))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(v=>v.trim()))rows.push(row);if(!rows.length)return [];const headers=rows.shift().map(h=>h.trim().toLowerCase());return rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,(r[i]||'').trim()]))) }
    async function importCsv(file){const text=await file.text();const rows=parseCsv(text);let added=0,skipped=0;for(const r of rows){const val=(...names)=>{for(const n of names)if(r[n]!==undefined)return r[n];return ''};const username=val('instagram username','username','handle').replace(/^@/,'');const email=val('public business email','email');if(!username||state.leads.some(l=>l.username.toLowerCase().replace(/^@/,'')===username.toLowerCase()||(email&&l.email&&l.email.toLowerCase()===email.toLowerCase()))){skipped++;continue}state.leads.push({id:val('lead id','id')||makeId(),name:val('creator name','name'),username,profileUrl:val('instagram profile url','profile url','profileurl')||`https://instagram.com/${encodeURIComponent(username)}`,niche:val('niche','category'),followers:Number(val('followers','follower count')||0),email,location:val('location'),bio:val('public profile notes','bio'),status:STATUS_OPTIONS.includes(val('status'))?val('status'):(email?'Email Available':'New Lead'),source:val('source','source / notes')||'CSV import',createdAt:day(),initialSentAt:'',followUp1SentAt:'',followUp2SentAt:'',followUp1Due:'',followUp2Due:'',replyType:'',lastReply:'',optOut:false,owner:'Campaign team',notes:val('internal note','notes')});added++}persist();render();toast(`${added} added · ${skipped} duplicate or incomplete rows skipped.`)}
    function exportCsv(){const cols=[['Lead ID','id'],['Creator Name','name'],['Instagram Username','username'],['Instagram Profile URL','profileUrl'],['Niche','niche'],['Followers','followers'],['Public Business Email','email'],['Location','location'],['Public Profile Notes','bio'],['Fit Score','score'],['Status','status'],['Source','source'],['Initial Email Sent','initialSentAt'],['Follow-up 1 Due','followUp1Due'],['Follow-up 1 Sent','followUp1SentAt'],['Follow-up 2 Due','followUp2Due'],['Follow-up 2 Sent','followUp2SentAt'],['Reply Type','replyType'],['Last Reply','lastReply'],['Opt Out','optOut'],['Owner','owner'],['Internal Note','notes']];const csv=[cols.map(c=>csvCell(c[0])).join(','),...state.leads.map(l=>cols.map(([label,key])=>csvCell(key==='score'?score(l):l[key])).join(','))].join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='sankar_creator_crm_export.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV exported for Google Sheets or Excel.')}
    function csvCell(v){const s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
    document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view)});
    document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('[data-action],[data-view]');if(!b)return;if(b.dataset.view){setView(b.dataset.view);return}const a=b.dataset.action;if(a==='add-lead')openLead();if(a==='open-lead')openLead(b.dataset.id);if(a==='open-reply')openLead(b.dataset.id,'reply');if(a==='import')document.getElementById('importFile').click();if(a==='export')exportCsv();if(a==='add-reply')openReply();if(a==='reset-demo'){if(confirm('Reset local demo data and remove your browser changes?')){localStorage.removeItem(KEY);state=structuredClone(seed);render();toast('Demo data reset.')}}});
    document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files?.[0])importCsv(e.target.files[0]);e.target.value=''});
    render();
  })();
  </script>
